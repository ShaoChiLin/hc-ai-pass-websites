<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151b4d">
  <title>竹青 AI 安心辦｜網站入口</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans TC", system-ui, -apple-system, sans-serif;
      color: #171a2b;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 10%, rgba(52, 87, 230, .16), transparent 32%),
        #f5f7fb;
    }
    main { width: min(760px, 100%); }
    .eyebrow {
      color: #3457e6;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    h1 { margin: 10px 0 8px; font-size: clamp(34px, 8vw, 56px); }
    .intro { margin: 0 0 28px; color: #687087; line-height: 1.7; }
    .site-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      border: 1px solid #e3e7f1;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 14px 40px rgba(21, 27, 77, .08);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .site-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 48px rgba(21, 27, 77, .14);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: #edf2ff;
      font-size: 27px;
    }
    .site-card strong { display: block; margin-bottom: 5px; font-size: 19px; }
    .site-card span { color: #687087; line-height: 1.5; }
    .arrow { color: #3457e6 !important; font-size: 24px; font-weight: 800; }
    footer { margin-top: 22px; color: #8a91a5; font-size: 12px; }
    @media (max-width: 520px) {
      .site-card { grid-template-columns: auto 1fr; }
      .arrow { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">竹青 AI 安心辦</div>
    <h1>網站入口</h1>
    <p class="intro">集中管理黑客松展示網站。後續新增功能時，可各自放在獨立資料夾中。</p>

    <a class="site-card" href="./subsidy/">
      <div class="icon">🧭</div>
      <div>
        <strong>AI 領航青年數位工具補助</strong>
        <span>資安宣導、補助試算、申請與進度展示</span>
      </div>
      <span class="arrow">→</span>
    </a>

    <footer>黑客松展示用途，非政府正式服務。</footer>
  </main>
</body>
</html>
